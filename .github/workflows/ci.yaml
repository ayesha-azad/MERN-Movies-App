name: CI for MERN App 

on: push

jobs: 

  frontend:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js Action for Frontend
        uses: ./.github/actions/action.yaml
        with:
          working-dir: 'frontend'

  backend:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Use Node.js Action for Backend
        uses: ./.github/actions/action.yaml
        with:
          working-dir: 'backend'

  docker:
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Docker Login
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      - name: Build Image
        run: docker compose build 
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Push Image
        run: docker compose push
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      - name: Run Containers
        run: docker compose up -d
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}

      

