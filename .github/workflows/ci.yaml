name: CI for MERN App 

on: push

jobs: 
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js Action for Frontend
        uses: ./.github/actions/action.yaml
        with:
          working-directory: 'frontend'

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js Action for Backend
        uses: ./.github/actions/action.yaml
        with:
          working-directory: 'backend'

  docker:
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Build Image
        run: docker compose build 
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Push Image
        run: docker compose push
        shell: bash
        working-directory: ${{ github.workspace }}

      - name: Run Containers
        run: docker compose up -d
        shell: bash
        working-directory: ${{ github.workspace }}

      

